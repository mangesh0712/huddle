services:
  - type: web
    name: huddle
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Huddle
      - key: CHANNELS
        value: Lounge,Chill,Gaming
      - key: SKIP_POLICY
        value: anyone
      - key: INVITE_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
